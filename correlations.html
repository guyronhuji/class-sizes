function pairKey(a, b) {
  return a < b ? `${a}||${b}` : `${b}||${a}`;
}

function normalizeCourseName(name) {
  if (typeof name !== "string") return name;
  return name.split("/")[0].trim();
}

function preprocessEdges(minStudents) {
  const raw = window.CORRELATION_DATA.filter((d) => d.n_students >= minStudents);

  const bestByPair = new Map();
  for (const edge of raw) {
    const courseA = normalizeCourseName(edge.course_A_name);
    const courseB = normalizeCourseName(edge.course_B_name);
    if (!courseA || !courseB || courseA === courseB) continue;

    const normalizedEdge = {
      ...edge,
      course_A_name: courseA,
      course_B_name: courseB,
    };

    const key = pairKey(courseA, courseB);
    const prev = bestByPair.get(key);
    if (!prev || normalizedEdge.n_students > prev.n_students || Math.abs(normalizedEdge.pearson_r) > Math.abs(prev.pearson_r)) {
      bestByPair.set(key, normalizedEdge);
    }
  }

  const deduped = Array.from(bestByPair.values());

  const degree = new Map();
  for (const e of deduped) {
    degree.set(e.course_A_name, (degree.get(e.course_A_name) || 0) + 1);
    degree.set(e.course_B_name, (degree.get(e.course_B_name) || 0) + 1);
  }

  const courses = Array.from(degree.entries())
    .filter(([, deg]) => deg > 0)
    .map(([name]) => name)
    .sort((a, b) => a.localeCompare(b, "he"));

  const idx = new Map(courses.map((name, i) => [name, i]));
  const n = courses.length;

  const z = Array.from({ length: n }, () => Array(n).fill(null));
  const nMat = Array.from({ length: n }, () => Array(n).fill(null));
  const pMat = Array.from({ length: n }, () => Array(n).fill(null));

  for (const e of deduped) {
    const i = idx.get(e.course_A_name);
    const j = idx.get(e.course_B_name);
    if (i == null || j == null || i === j) continue;
    z[i][j] = e.pearson_r;
    z[j][i] = e.pearson_r;
    nMat[i][j] = e.n_students;
    nMat[j][i] = e.n_students;
    pMat[i][j] = e.p_value;
    pMat[j][i] = e.p_value;
  }

  return { deduped, courses, z, nMat, pMat };
}

function reorderMatrix(matrix, order) {
  return order.map((i) => order.map((j) => matrix[i][j]));
}

function distanceFromR(r) {
  if (r == null || Number.isNaN(r)) return 1.05;
  return 1 - Math.abs(r);
}

function avgLink(clusterA, clusterB, z) {
  let sum = 0;
  let count = 0;
  for (const i of clusterA.items) {
    for (const j of clusterB.items) {
      sum += distanceFromR(z[i][j]);
      count += 1;
    }
  }
  return count ? sum / count : 1.05;
}

function buildClusterTree(z) {
  const n = z.length;
  if (n === 0) return null;

  let nextId = n;
  let clusters = Array.from({ length: n }, (_, i) => ({
    id: i,
    items: [i],
    left: null,
    right: null,
    height: 0,
  }));

  while (clusters.length > 1) {
    let bestI = 0;
    let bestJ = 1;
    let bestD = Infinity;

    for (let i = 0; i < clusters.length - 1; i++) {
      for (let j = i + 1; j < clusters.length; j++) {
        const d = avgLink(clusters[i], clusters[j], z);
        if (d < bestD) {
          bestD = d;
          bestI = i;
          bestJ = j;
        }
      }
    }

    const left = clusters[bestI];
    const right = clusters[bestJ];
    const merged = {
      id: nextId++,
      items: left.items.concat(right.items),
      left,
      right,
      height: bestD,
    };

    clusters.splice(bestJ, 1);
    clusters.splice(bestI, 1);
    clusters.push(merged);
  }

  return clusters[0];
}

function leafOrder(node, out = []) {
  if (!node) return out;
  if (!node.left && !node.right) {
    out.push(node.items[0]);
  } else {
    leafOrder(node.left, out);
    leafOrder(node.right, out);
  }
  return out;
}

function buildDendrogramTraces(tree) {
  if (!tree) return { order: [], topTrace: null, leftTrace: null, maxH: 1 };
  const order = leafOrder(tree);
  if (order.length <= 1) return { order, topTrace: null, leftTrace: null, maxH: 1 };

  const pos = new Map(order.map((leaf, i) => [leaf, i]));
  const topX = [];
  const topY = [];
  const leftX = [];
  const leftY = [];

  function addTop(x1, y1, x2, y2) {
    topX.push(x1, x2, null);
    topY.push(y1, y2, null);
  }

  function addLeft(x1, y1, x2, y2) {
    leftX.push(x1, x2, null);
    leftY.push(y1, y2, null);
  }

  function walk(node) {
    if (!node.left && !node.right) {
      const center = pos.get(node.items[0]);
      return { center, height: 0 };
    }

    const left = walk(node.left);
    const right = walk(node.right);
    const h = node.height;

    addTop(left.center, left.height, left.center, h);
    addTop(right.center, right.height, right.center, h);
    addTop(left.center, h, right.center, h);

    addLeft(left.height, left.center, h, left.center);
    addLeft(right.height, right.center, h, right.center);
    addLeft(h, left.center, h, right.center);

    return { center: (left.center + right.center) / 2, height: h };
  }

  walk(tree);

  const topTrace = {
    type: "scatter",
    mode: "lines",
    x: topX,
    y: topY,
    xaxis: "x2",
    yaxis: "y2",
    line: { color: "#98a2c3", width: 1.2 },
    hoverinfo: "skip",
    showlegend: false,
  };

  const leftTrace = {
    type: "scatter",
    mode: "lines",
    x: leftX,
    y: leftY,
    xaxis: "x3",
    yaxis: "y3",
    line: { color: "#98a2c3", width: 1.2 },
    hoverinfo: "skip",
    showlegend: false,
  };

  return { order, topTrace, leftTrace, maxH: Math.max(1e-6, tree.height) };
}

function buildHoverText(courses, z, nMat, pMat) {
  const text = [];
  for (let i = 0; i < courses.length; i++) {
    const row = [];
    for (let j = 0; j < courses.length; j++) {
      const r = z[i][j];
      if (r == null) {
        row.push("No significant correlation");
      } else {
        row.push(
          `<b>${courses[i]}</b><br>` +
          `↔ <b>${courses[j]}</b><br>` +
          `Pearson r: ${r.toFixed(4)}<br>` +
          `p-value: ${pMat[i][j].toExponential(3)}<br>` +
          `Students: ${nMat[i][j]}`
        );
      }
    }
    text.push(row);
  }
  return text;
}

function buildClustermapLayout(title, n, maxH, courses) {
  const allTickLabels = {
    tickmode: "array",
    tickvals: courses,
    ticktext: courses,
    automargin: true,
  };

  return {
    ...HEATMAP_LAYOUT_BASE,
    title: { text: title, font: { color: "#e0e4ef", size: 16 } },
    height: Math.max(760, Math.min(1700, 320 + n * 10)),
    margin: { t: 32, r: 24, b: 160, l: 220 },
    xaxis: {
      ...HEATMAP_LAYOUT_BASE.xaxis,
      domain: [0.4, 1.0],
      layer: "above traces",
      ...allTickLabels,
    },
    yaxis: {
      ...HEATMAP_LAYOUT_BASE.yaxis,
      domain: [0.0, 0.78],
      layer: "above traces",
      ...allTickLabels,
    },
    xaxis2: {
      domain: [0.4, 1.0],
      range: [-0.5, n - 0.5],
      showticklabels: false,
      ticks: "",
      showgrid: false,
      zeroline: false,
      fixedrange: true,
    },
    yaxis2: {
      domain: [0.82, 1.0],
      range: [0, maxH * 1.05],
      showticklabels: false,
      ticks: "",
      showgrid: false,
      zeroline: false,
      fixedrange: true,
    },
    xaxis3: {
      domain: [0.0, 0.16],
      range: [maxH * 1.05, 0],
      showticklabels: false,
      ticks: "",
      showgrid: false,
      zeroline: false,
      fixedrange: true,
    },
    yaxis3: {
      domain: [0.0, 0.78],
      range: [n - 0.5, -0.5],
      showticklabels: false,
      ticks: "",
      showgrid: false,
      zeroline: false,
      fixedrange: true,
    },
  };
}

function HeatmapPanel({ id, title, courses, z, nMat, pMat, extraTraces = [], layout = null, showColorbar = true }) {
  const ref = useRef(null);
  const initialized = useRef(false);

  useEffect(() => {
    if (!ref.current) return;

    const trace = {
      type: "heatmap",
      x: courses,
      y: courses,
      z,
      zmin: -1,
      zmax: 1,
      zmid: 0,
      colorscale: [[0, "#2b6cb0"], [0.5, "#f7fafc"], [1, "#c53030"]],
      hoverinfo: "text",
      text: buildHoverText(courses, z, nMat, pMat),
      colorbar: showColorbar
        ? {
            title: { text: "Pearson r", font: { color: "#98a2c3", size: 11 } },
            tickfont: { color: "#98a2c3" },
            thickness: 12,
            len: 0.68,
          }
        : undefined,
    };

    const allTickLabels = {
      tickmode: "array",
      tickvals: courses,
      ticktext: courses,
      automargin: true,
    };

    const defaultLayout = {
      ...HEATMAP_LAYOUT_BASE,
      title: { text: title, font: { color: "#e0e4ef", size: 16 } },
      height: Math.max(640, Math.min(1300, 300 + courses.length * 12)),
      xaxis: {
        ...HEATMAP_LAYOUT_BASE.xaxis,
        layer: "above traces",
        ...allTickLabels,
      },
      yaxis: {
        ...HEATMAP_LAYOUT_BASE.yaxis,
        layer: "above traces",
        ...allTickLabels,
      },
    };

    const traces = [trace, ...extraTraces.filter(Boolean)];
    const panelLayout = layout || defaultLayout;

    if (!initialized.current) {
      Plotly.newPlot(ref.current, traces, panelLayout, PLOTLY_CONFIG);
      initialized.current = true;
    } else {
      Plotly.react(ref.current, traces, panelLayout, PLOTLY_CONFIG);
    }
  }, [courses, z, nMat, pMat, title, extraTraces, layout, showColorbar]);

  useEffect(() => () => { if (ref.current) Plotly.purge(ref.current); }, []);

  return (
    <div
      className="rounded-3xl border overflow-hidden"
      style={{ backgroundColor: "#181b24", borderColor: "#282d3e" }}
    >
      <div className="px-6 pt-5 pb-2 space-y-1">
        <div className="text-xs uppercase tracking-[0.24em]" style={{ color: "#98a2c3" }}>
          Correlation map
        </div>
        <h2 className="text-2xl md:text-3xl" style={{ fontFamily: 'Georgia, "Times New Roman", serif' }}>
          {title}
        </h2>
      </div>
      <div ref={ref} id={id} style={{ width: "100%" }} />
    </div>
  );
}

function App() {
  const [minStudents, setMinStudents] = useState(DEFAULT_N);

  const prepared = useMemo(() => preprocessEdges(minStudents), [minStudents]);

  const clustered = useMemo(() => {
    const { courses, z, nMat, pMat } = prepared;
    if (!courses.length) return null;
    const tree = buildClusterTree(z);
    const dendo = buildDendrogramTraces(tree);
    const order = dendo.order.length ? dendo.order : Array.from({ length: courses.length }, (_, i) => i);
    return {
      courses: order.map((i) => courses[i]),
      z: reorderMatrix(z, order),
      nMat: reorderMatrix(nMat, order),
      pMat: reorderMatrix(pMat, order),
      dendrogram: dendo,
    };
  }, [prepared]);

  const coursesShown = prepared.courses.length;
  const pairsShown = prepared.deduped.length;

  function handleMinStudents(value) {
    const parsed = parseInt(value, 10);
    if (Number.isNaN(parsed)) return;
    setMinStudents(Math.max(MIN_N, Math.min(MAX_N, parsed)));
  }

  return (
    <div
      className="min-h-screen w-full overflow-y-auto px-4 py-8 md:px-8"
      style={{ backgroundColor: "#0f1117", color: "#e0e4ef", fontFamily: '"DM Sans", system-ui, sans-serif' }}
    >
      <div className="mx-auto max-w-7xl space-y-6">
        <header className="space-y-4">
          <div className="flex flex-wrap items-center gap-3">
            <a
              href="./index.html"
              className="inline-flex items-center rounded-full border px-3 py-1 text-xs uppercase tracking-[0.24em]"
              style={{ borderColor: "#282d3e", backgroundColor: "#181b24", color: "#98a2c3" }}
            >
              ← Back
            </a>
            <div
              className="inline-flex items-center rounded-full border px-3 py-1 text-xs uppercase tracking-[0.24em]"
              style={{ borderColor: "#282d3e", backgroundColor: "#181b24", color: "#98a2c3" }}
            >
              Grade correlations · Significant only
            </div>
          </div>

          <div className="space-y-2">
            <div className="text-xs uppercase tracking-[0.28em]" style={{ color: "#5b8af5" }}>
              Correlation Analysis
            </div>
            <h1 className="text-4xl md:text-5xl leading-tight" style={{ fontFamily: 'Georgia, "Times New Roman", serif' }}>
              Course <span style={{ color: "#5bf5a8" }}>Correlations</span>
            </h1>
            <p className="max-w-3xl text-base leading-7" style={{ color: "#b5bdd4" }}>
              Heatmap and clustermap of significant class-to-class grade correlations.
              Only classes participating in significant pairs after filtering are shown.
            </p>
          </div>
        </header>

        <div className="rounded-3xl border p-5 flex flex-wrap items-center gap-5" style={{ backgroundColor: "#181b24", borderColor: "#282d3e" }}>
          <div className="text-xs uppercase tracking-[0.24em]" style={{ color: "#98a2c3" }}>Filter</div>
          <label className="flex items-center gap-3 text-sm" style={{ color: "#b5bdd4" }}>
            Min students
            <input
              type="number"
              value={minStudents}
              min={MIN_N}
              max={MAX_N}
              onChange={(e) => handleMinStudents(e.target.value)}
              className="w-20 rounded-xl border bg-transparent px-3 py-1.5 text-center text-sm font-medium outline-none focus:border-blue-500"
              style={{ borderColor: "#282d3e", color: "#e0e4ef", backgroundColor: "#11141c" }}
            />
            <input
              type="range"
              value={minStudents}
              min={MIN_N}
              max={MAX_N}
              onChange={(e) => handleMinStudents(e.target.value)}
              className="w-40 accent-blue-400"
            />
          </label>
          <div className="ml-auto text-sm" style={{ color: "#98a2c3" }}>
            <span className="font-semibold" style={{ color: "#e0e4ef" }}>{pairsShown}</span> significant pairs ·
            <span className="font-semibold" style={{ color: "#e0e4ef" }}> {coursesShown} </span>classes
          </div>
        </div>

        {coursesShown === 0 ? (
          <div className="rounded-3xl border p-6" style={{ backgroundColor: "#181b24", borderColor: "#282d3e", color: "#f5a85b" }}>
            No significant correlations remain for this minimum-students filter.
          </div>
        ) : (
          <>
            <HeatmapPanel
              id="corr-heatmap"
              title="Significant correlations · alphabetic order"
              courses={prepared.courses}
              z={prepared.z}
              nMat={prepared.nMat}
              pMat={prepared.pMat}
            />

            {clustered && (
              <HeatmapPanel
                id="corr-clustermap"
                title="Significant correlations · clustered order with dendrograms"
                courses={clustered.courses}
                z={clustered.z}
                nMat={clustered.nMat}
                pMat={clustered.pMat}
                extraTraces={[clustered.dendrogram.topTrace, clustered.dendrogram.leftTrace]}
                layout={buildClustermapLayout("Significant correlations · clustered order with dendrograms", clustered.courses.length, clustered.dendrogram.maxH, clustered.courses)}
              />
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

            + '<pre style="margin:0;white-space:pre-wrap;color:#f5a85b;font-family:ui-monospace,monospace;">'
            + String(error && error.stack ? error.stack : error)
            + "</pre>"
            + "</div>";
        }
      })();
    </script>
  </body>
